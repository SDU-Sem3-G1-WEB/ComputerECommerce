name: .NET

on:
  push:
    branches: [ "AutomaticTesting" ]
  pull_request:
    branches: [ "AutomaticTesting" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
          dotnet-version: 8.0.x

    - name: Restore dependencies (ComputerECommerce)
      run: dotnet restore

    - name: Build (ComputerECommerce)
      run: dotnet build --no-restore
    
  test:
    runs-on: ubuntu-latest

    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
          dotnet-version: 8.0.x

    - name: Restore dependencies (ComputerECommerce)
      run: dotnet restore
    
    - name: Test application (ComputerEcommerce)
      run: dotnet test
